experiment: home_benchmarks
datasets: [dataset_one, dataset_two]
external_datasets:
  dataset_one:
    path: "D:/datasets/dataset_one.csv"
    target: class
    delimiter: ","
  dataset_two:
    path: "D:/datasets/dataset_two.csv"
    target: label
    delimiter: ","
methods: [EHOA, SF-EHOA, IG-EHOA, DFA-EHOA]
seeds: [42, 123, 2026, 3407, 8675309]
population: 8
iterations: 8
folds: 5
test_size: 0.2
workers: 1
resume: true
dfa:
  stability_strategy: periodic
  stability_interval: 2
  bootstrap_count: 5
  resample_fraction: 0.8
  reliability_source: resampling
  reliability_rho: 0.6
  interaction_top_k: 50
  lambda_stability: 0.5
  lambda_interaction: 0.5
  weight_schedule: adaptive
