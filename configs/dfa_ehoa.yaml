experiment: dfa_ehoa
datasets: [breast_cancer, wine]
methods: [DFA-EHOA]
seeds: [42, 123, 2026]
population: 8
iterations: 8
folds: 5
test_size: 0.2
workers: 1
resume: true
dfa:
  stability_strategy: periodic
  stability_interval: 2
  bootstrap_count: 5
  reliability_rho: 0.6
  interaction_top_k: 50
  lambda_stability: 0.5
  lambda_interaction: 0.5
  weight_schedule: adaptive
