experiment: paper_revised
datasets: [breast_cancer, wine]
methods: [EHOA, SF-EHOA, IG-EHOA, DFA-EHOA]
seeds: [42, 123, 2026, 3407, 7919, 104729, 130363, 155921, 196613, 262147]
population: 8
iterations: 10
folds: 5
test_size: 0.2
workers: 1
resume: true
dfa:
  stability_strategy: periodic
  stability_interval: 2
  bootstrap_count: 7
  resample_fraction: 0.8
  reliability_source: resampling
  reliability_rho: 0.6
  interaction_top_k: 50
  lambda_stability: 0.5
  lambda_interaction: 0.5
  weight_schedule: adaptive
  eta_exploration: 0.45
  eta_consolidation: 0.30
